<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .label { font: 14px "Trebuchet MS", Arial, sans-serif; fill: #111827; }
      .num { font: 18px "Trebuchet MS", Arial, sans-serif; font-weight: bold; fill: #0f172a; }
      .arrow { stroke: #111827; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>
  <rect width="960" height="240" fill="#f8fafc" />

  <rect x="40" y="70" width="160" height="90" rx="12" class="box" />
  <text x="60" y="105" class="num">1</text>
  <text x="120" y="110" text-anchor="middle" class="label">Prepare Server</text>

  <rect x="220" y="70" width="160" height="90" rx="12" class="box" />
  <text x="240" y="105" class="num">2</text>
  <text x="300" y="110" text-anchor="middle" class="label">Create Dirs</text>

  <rect x="400" y="70" width="160" height="90" rx="12" class="box" />
  <text x="420" y="105" class="num">3</text>
  <text x="480" y="110" text-anchor="middle" class="label">Config + Env</text>

  <rect x="580" y="70" width="160" height="90" rx="12" class="box" />
  <text x="600" y="105" class="num">4</text>
  <text x="660" y="110" text-anchor="middle" class="label">Compose Up</text>

  <rect x="760" y="70" width="160" height="90" rx="12" class="box" />
  <text x="780" y="105" class="num">5</text>
  <text x="840" y="110" text-anchor="middle" class="label">Verify + Go Live</text>

  <line x1="200" y1="115" x2="220" y2="115" class="arrow" marker-end="url(#arrow)" />
  <line x1="380" y1="115" x2="400" y2="115" class="arrow" marker-end="url(#arrow)" />
  <line x1="560" y1="115" x2="580" y2="115" class="arrow" marker-end="url(#arrow)" />
  <line x1="740" y1="115" x2="760" y2="115" class="arrow" marker-end="url(#arrow)" />
</svg>
